version: "3.8"

services:
  nginx:
    image: nginx:latest
    container_name: nginx
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro  # folder with SSL certs
    ports:
      - "80:80"
      - "443:443"
    networks:
      - web-network

networks:
  web-network:
    external: true
