version: "3.8"

services:
  certbot:
    image: certbot/certbot
    volumes:
      - ./certs:/etc/letsencrypt
    entrypoint: >
      sh -c "certbot certonly --standalone --preferred-challenges http
      --agree-tos --no-eff-email --email anup.kalbalia@email.com
      -d yourdomain.com"
    ports:
      - "80:80"
